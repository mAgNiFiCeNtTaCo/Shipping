<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f5a50"/>
      <stop offset="1" stop-color="#136f63"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06211d" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#dots)"/>
  <circle cx="1130" cy="40" r="230" fill="#ffffff" opacity=".04"/>
  <circle cx="1240" cy="420" r="170" fill="#d9a441" opacity=".08"/>

  <!-- icon: the app's parcel with a label -->
  <g transform="translate(70 70) scale(.25)" filter="url(#shadow)">
    <rect width="512" height="512" rx="112" fill="#fbfaf7"/>
    <path d="M256 92 410 168v176L256 420 102 344V168Z" fill="#f6e7c8"/>
    <path d="M256 92 410 168 256 244 102 168Z" fill="#fff6e4"/>
    <path d="M256 244v176L102 344V168Z" fill="#ead2a4"/>
    <path d="M179 130 333 206v56l-30 14v-55L149 145Z" fill="#d9a441"/>
    <g transform="rotate(-26.3 256 244)">
      <rect x="282" y="268" width="128" height="86" rx="12" fill="#ffffff" stroke="#136f63" stroke-width="8"/>
      <rect x="300" y="288" width="62" height="10" rx="5" fill="#136f63"/>
      <rect x="300" y="308" width="92" height="10" rx="5" fill="#136f63" opacity=".55"/>
      <rect x="300" y="326" width="74" height="10" rx="5" fill="#136f63" opacity=".55"/>
    </g>
  </g>

  <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="214" y="138" font-size="72" font-weight="700" fill="#fbfaf7" letter-spacing="-1">Ship Desk</text>
    <text x="72" y="236" font-size="30" fill="#e8f3f0">Drop TCGplayer's shipping CSV.</text>
    <text x="72" y="276" font-size="30" fill="#e8f3f0">Get labels, packing slips, stamps and</text>
    <text x="72" y="316" font-size="30" fill="#e8f3f0">the file that marks the batch shipped.</text>

    <!-- small facts -->
    <g font-size="17" font-weight="600">
      <rect x="72" y="350" width="148" height="34" rx="17" fill="#ffffff" opacity=".12"/>
      <text x="146" y="373" text-anchor="middle" fill="#fbfaf7">Runs on your PC</text>
      <rect x="232" y="350" width="140" height="34" rx="17" fill="#ffffff" opacity=".12"/>
      <text x="302" y="373" text-anchor="middle" fill="#fbfaf7">Works offline</text>
      <rect x="384" y="350" width="150" height="34" rx="17" fill="#ffffff" opacity=".12"/>
      <text x="459" y="373" text-anchor="middle" fill="#fbfaf7">iPhone photos</text>
      <rect x="546" y="350" width="118" height="34" rx="17" fill="#d9a441"/>
      <text x="605" y="373" text-anchor="middle" fill="#3b2a07">Free · MIT</text>
    </g>

    <!-- a 4x6 label, tilted -->
    <g transform="translate(860 70) rotate(4)" filter="url(#shadow)">
      <rect width="290" height="300" rx="10" fill="#ffffff"/>
      <text x="22" y="36" font-size="13" font-weight="700" fill="#1d2321">Your Card Shop</text>
      <text x="22" y="54" font-size="12" fill="#5b6662">12 Return Rd</text>
      <text x="22" y="70" font-size="12" fill="#5b6662">Austin, TX 78701</text>
      <!-- QR-ish block -->
      <g fill="#1d2321">
        <rect x="222" y="22" width="46" height="46" rx="3" fill="none" stroke="#1d2321" stroke-width="3"/>
        <rect x="229" y="29" width="12" height="12"/><rect x="249" y="29" width="12" height="12"/>
        <rect x="229" y="49" width="12" height="12"/><rect x="250" y="50" width="5" height="5"/>
        <rect x="257" y="57" width="5" height="5"/><rect x="250" y="59" width="4" height="4"/>
      </g>
      <!-- IMb-style bars -->
      <g fill="#1d2321">
        <rect x="40" y="118" width="3" height="18"/><rect x="47" y="122" width="3" height="10"/><rect x="54" y="114" width="3" height="22"/>
        <rect x="61" y="122" width="3" height="14"/><rect x="68" y="118" width="3" height="10"/><rect x="75" y="114" width="3" height="18"/>
        <rect x="82" y="122" width="3" height="10"/><rect x="89" y="118" width="3" height="18"/><rect x="96" y="114" width="3" height="22"/>
        <rect x="103" y="122" width="3" height="14"/><rect x="110" y="114" width="3" height="18"/><rect x="117" y="122" width="3" height="10"/>
        <rect x="124" y="118" width="3" height="18"/><rect x="131" y="114" width="3" height="22"/><rect x="138" y="122" width="3" height="14"/>
        <rect x="145" y="118" width="3" height="10"/><rect x="152" y="114" width="3" height="18"/><rect x="159" y="122" width="3" height="10"/>
        <rect x="166" y="118" width="3" height="18"/><rect x="173" y="114" width="3" height="22"/><rect x="180" y="122" width="3" height="14"/>
        <rect x="187" y="118" width="3" height="18"/><rect x="194" y="114" width="3" height="10"/><rect x="201" y="122" width="3" height="14"/>
        <rect x="208" y="114" width="3" height="22"/><rect x="215" y="118" width="3" height="10"/><rect x="222" y="122" width="3" height="14"/>
        <rect x="229" y="114" width="3" height="18"/><rect x="236" y="118" width="3" height="18"/><rect x="243" y="122" width="3" height="10"/>
      </g>
      <text x="40" y="170" font-size="22" font-weight="700" fill="#1d2321">Ash Example</text>
      <text x="40" y="196" font-size="18" fill="#1d2321">45 Example St</text>
      <text x="40" y="220" font-size="18" fill="#1d2321">Los Angeles, CA 90012</text>
      <line x1="22" y1="252" x2="268" y2="252" stroke="#dcd8cf" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="22" y="280" font-size="11" font-style="italic" fill="#5b6662">Thanks for your order!</text>
      <text x="268" y="280" font-size="11" text-anchor="end" fill="#5b6662">Order SAMPLE-0001</text>
    </g>

    <!-- plan chips floating over the label -->
    <g font-size="15" font-weight="700" filter="url(#shadow)">
      <g transform="translate(716 104)">
        <rect width="150" height="34" rx="17" fill="#e3f4ec"/>
        <circle cx="20" cy="17" r="5" fill="#1f9d5b"/>
        <text x="32" y="22" fill="#14663c">Envelope OK</text>
      </g>
      <g transform="translate(670 176)">
        <rect width="194" height="34" rx="17" fill="#fdf1d6"/>
        <circle cx="20" cy="17" r="5" fill="#d9a441"/>
        <text x="32" y="22" fill="#7a5410">Tracking recommended</text>
      </g>
      <g transform="translate(698 248)">
        <rect width="168" height="34" rx="17" fill="#e5ecfb"/>
        <circle cx="20" cy="17" r="5" fill="#3b6fd8"/>
        <text x="32" y="22" fill="#24479a">Tracking required</text>
      </g>
      <g transform="translate(686 320)">
        <rect width="176" height="34" rx="17" fill="#fbe7ec"/>
        <circle cx="20" cy="17" r="5" fill="#d8395e"/>
        <text x="32" y="22" fill="#8f1e3a">Signature required</text>
      </g>
    </g>
  </g>
</svg>
